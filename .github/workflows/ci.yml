name: CI

# Deliberately mirrors the workflow scaffld itself generates for a python-lib
# project (src/scaffld/builtins/python-lib/files/.github/workflows/ci.yml): a
# tool that sets up other people's CI should run the CI it hands out.
#
# The matrix is 3.9-3.12, from this package's own classifiers. Python 3.9 is
# past end of life (2025-10-31) but the published package still claims it, so
# it stays tested until the claim is dropped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Callable, so the release pipeline runs the same suite rather than a copy
  # of it. A release that tests something slightly different from CI is a
  # release that ships what CI never saw.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package declares, plus the current stable release.
        # 3.9 reached end of life on 2025-10-31: it stays as *compatibility*
        # until the floor rises in 0.2.0, and is not "supported by upstream".
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  generated-project:
    # The job name is fixed on purpose. With an object-valued matrix GitHub
    # would name each cell after every property of the object, and the
    # branch protection requires the exact context `generated-project
    # (python-lib)` and siblings -- a renamed cell would leave those
    # required checks pending forever and block every merge. The benign
    # cells keep the old name; the hostile ones add a suffix.
    name: generated-project (${{ matrix.template }}${{ matrix.who.label == 'hostile' && ', hostile' || '' }})
    # The suite tests scaffld's internals. This tests what scaffld is FOR: that
    # a project it generates is actually well-formed — installs, and passes the
    # tests scaffld wrote for it. A scaffolder whose output does not build is
    # broken however green its own unit tests are.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [python-lib, python-cli, python-api]
        # Two inputs per template, not one. The suite proves the escaping
        # filters round-trip; this proves the whole project still builds when
        # the author and description carry the characters that used to break
        # pyproject.toml (audit F03): quotes, a backslash, non-ASCII, and a
        # newline in the description. One benign name was the only input here
        # before, which is how nine of twelve combinations stayed broken while
        # this job stayed green.
        who:
          - label: benign
            author: "Fernando Aporta Franco"
            description: "A project generated by CI to prove the template works."
          - label: hostile
            author: 'Ana "AI" \ Café'
            description: "First line\nsecond line — with \"quotes\", a backslash \\ and ñ"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install scaffld
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate a project from the ${{ matrix.template }} template (${{ matrix.who.label }} inputs)
        # Values go through env, not through the command line: interpolating
        # them into the shell would need the very escaping this job exists to
        # test, and would test the workflow's quoting instead of scaffld's.
        env:
          AUTHOR: ${{ matrix.who.author }}
          DESCRIPTION: ${{ matrix.who.description }}
        run: |
          scaffld new "Demo Project" \
            -t ${{ matrix.template }} \
            -a "$AUTHOR" \
            -d "$DESCRIPTION" \
            --no-input --no-venv -o /tmp/out

      - name: The generated project installs and its tests pass
        working-directory: /tmp/out/demo-project
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: The generated project builds a wheel
        working-directory: /tmp/out/demo-project
        run: |
          pip install build
          python -m build

  no-vendored-env:
    # A virtualenv called `.v` was committed to main on 2026-09-06: 1,380 files
    # and 467,125 lines. .gitignore listed `.venv/`, `venv/` and `env/` but not
    # that spelling, and a broad `git add` swept it in.
    #
    # .gitignore alone cannot prevent a repeat: it does nothing for a path that
    # is already tracked, and nothing against `git add -f`. So this guard asks
    # git what it is actually tracking, which is the invariant that matters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No virtualenv or vendored site-packages may be tracked
        run: |
          # Markers, not directory names: an environment is recognisable by what
          # is inside it whatever it was called.
          found=$(git ls-files | grep -E '(^|/)(pyvenv\.cfg|site-packages/|dist-packages/)|(^|/)\.?(v|venv|virtualenv)/(bin|lib|Scripts)/' || true)
          if [ -n "$found" ]; then
            echo "Tracked files that look like a virtualenv or vendored packages:"
            echo "$found" | head -20
            echo "..."
            echo "$found" | wc -l | xargs echo "total:"
            echo
            echo "Remove them with 'git rm -r --cached <dir>' and add the directory to .gitignore."
            exit 1
          fi
          echo "clean: nothing that looks like a vendored environment is tracked"

      - name: The tracked tree stays a sane size
        # A blunt backstop for the general shape of the mistake — a large tree
        # arriving at once — for cases the markers above do not name. The repo
        # tracks 51 files today, so 300 allows it to grow six-fold before this
        # needs revisiting, and still catches an accident far smaller than the
        # 1,380 files that prompted it. Raise it deliberately, with a reason.
        run: |
          n=$(git ls-files | wc -l)
          echo "tracked files: $n"
          if [ "$n" -gt 300 ]; then
            echo "That is far more than this project should contain. Check what was added."
            exit 1
          fi
