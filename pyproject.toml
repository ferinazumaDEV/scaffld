[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffld"
version = "0.1.0"
description = "Scaffold new Python projects in seconds with a friendly TUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fernando (ferinazuma)" }]
keywords = [
    "scaffold",
    "boilerplate",
    "project-generator",
    "cookiecutter",
    "template",
    "cli",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scaffld = "scaffld.cli:main"

[project.urls]
Homepage = "https://github.com/ferinazuma/scaffld"
Source = "https://github.com/ferinazuma/scaffld"
Issues = "https://github.com/ferinazuma/scaffld/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scaffld = ["builtins/**/*", "builtins/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py39"
